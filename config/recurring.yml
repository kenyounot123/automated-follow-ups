# The demo clock is pinned, so a recurring run returns the same answer every tick
# and the UI button is what drives the demo. This is the shape it would take in
# production, where "now" actually moves.
development:
  scheduled_reconciliation:
    command: "Cadence::SweepJob.perform_later(Account.first.cadence)"
    schedule: every 15 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
